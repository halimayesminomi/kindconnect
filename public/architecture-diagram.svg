<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 860" width="920" height="860">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>

    <!-- Marker / Arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>

    <!-- Shadow Filter -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #0f172a; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
    .tier-heading { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 16px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 10px; letter-spacing: 1px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #1e293b; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; fill: #64748b; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px; fill: #334155; }
    .meta-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; }
  </style>

  <!-- Outer Canvas Frame -->
  <rect x="10" y="10" width="900" height="840" rx="20" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(460, 40)" text-anchor="middle">
    <rect x="-170" y="0" width="340" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="0" y="17" text-anchor="middle" class="badge" fill="#065f46">METROPOLITAN UNIVERSITY • CSE 36 (EVE)</text>
    
    <text x="0" y="56" class="title" font-size="24">KindConnect System Architecture</text>
    <text x="0" y="78" class="subtitle">Full-Stack 3-Tier Architecture &amp; Secure Data Communication Flow</text>
    <line x1="-400" y1="94" x2="400" y2="94" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>

  <!-- ==================== TIER 1: CLIENT ==================== -->
  <g transform="translate(45, 155)">
    <!-- Main Tier Box -->
    <rect x="0" y="0" width="830" height="135" rx="14" fill="url(#clientGrad)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Tier Header -->
    <text x="24" y="32" class="tier-heading" fill="#0369a1">🌐 [ Web Browser / Client Tier ]</text>
    <rect x="695" y="16" width="112" height="22" rx="6" fill="#bae6fd"/>
    <text x="751" y="31" text-anchor="middle" class="badge" fill="#075985">PRESENTATION</text>

    <!-- Sub-chips (4 columns) -->
    <!-- Col 1 -->
    <g transform="translate(24, 48)">
      <rect x="0" y="0" width="180" height="68" rx="8" fill="#ffffff" stroke="#bae6fd"/>
      <text x="90" y="28" text-anchor="middle" class="item-title">Next.js 15 (App Router)</text>
      <text x="90" y="48" text-anchor="middle" class="item-desc">Fast SSR &amp; Page Routing</text>
    </g>

    <!-- Col 2 -->
    <g transform="translate(224, 48)">
      <rect x="0" y="0" width="180" height="68" rx="8" fill="#ffffff" stroke="#bae6fd"/>
      <text x="90" y="28" text-anchor="middle" class="item-title">React 19 Components</text>
      <text x="90" y="48" text-anchor="middle" class="item-desc">Dynamic Hooks &amp; State</text>
    </g>

    <!-- Col 3 -->
    <g transform="translate(424, 48)">
      <rect x="0" y="0" width="180" height="68" rx="8" fill="#ffffff" stroke="#bae6fd"/>
      <text x="90" y="28" text-anchor="middle" class="item-title">Tailwind CSS v4</text>
      <text x="90" y="48" text-anchor="middle" class="item-desc">Responsive Layout &amp; Theme</text>
    </g>

    <!-- Col 4 -->
    <g transform="translate(624, 48)">
      <rect x="0" y="0" width="180" height="68" rx="8" fill="#ffffff" stroke="#bae6fd"/>
      <text x="90" y="28" text-anchor="middle" class="item-title">Client Capabilities</text>
      <text x="90" y="48" text-anchor="middle" class="item-desc">QR Scanner, Chat Stream</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR 1 ==================== -->
  <g transform="translate(460, 290)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="-195" y="7" width="390" height="26" rx="13" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="24" text-anchor="middle" class="pill-text">🔒 HTTP REST API Requests (Bearer JWT Authorization)</text>
  </g>

  <!-- ==================== TIER 2: SERVER ==================== -->
  <g transform="translate(45, 335)">
    <!-- Main Tier Box -->
    <rect x="0" y="0" width="830" height="210" rx="14" fill="url(#serverGrad)" stroke="#16a34a" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Tier Header -->
    <text x="24" y="32" class="tier-heading" fill="#15803d">⚙️ [ Node.js + Express.js 5 API Server Tier ]</text>
    <rect x="680" y="16" width="126" height="22" rx="6" fill="#bbf7d0"/>
    <text x="743" y="31" text-anchor="middle" class="badge" fill="#14532d">APPLICATION LOGIC</text>

    <!-- Sub-layers (3 horizontal rows) -->
    <!-- Row 1: Middleware -->
    <g transform="translate(24, 46)">
      <rect x="0" y="0" width="782" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <rect x="8" y="7" width="160" height="28" rx="6" fill="#dcfce7"/>
      <text x="88" y="25" text-anchor="middle" class="badge" fill="#166534">├── Token &amp; Role Check</text>
      <text x="185" y="26" class="pill-text" font-weight="600">JWT Verification Middleware  •  Role-Based Access Control (RBAC)  •  Bcrypt Password Hash</text>
    </g>

    <!-- Row 2: Controllers -->
    <g transform="translate(24, 96)">
      <rect x="0" y="0" width="782" height="52" rx="8" fill="#ffffff" stroke="#86efac"/>
      <rect x="8" y="12" width="160" height="28" rx="6" fill="#dcfce7"/>
      <text x="88" y="30" text-anchor="middle" class="badge" fill="#166534">├── Business Controllers</text>
      <text x="185" y="24" class="item-title" font-size="11.5">Events, Auth, Registrations, QR Code Attendance &amp; Points, 1000-Pt Certificate Engine</text>
      <text x="185" y="42" class="item-desc" font-size="11">Live Chat (Event Group &amp; 1-on-1 Admin Support), Emergency Relief Hub, Admin Dashboard</text>
    </g>

    <!-- Row 3: Mongoose Validation -->
    <g transform="translate(24, 156)">
      <rect x="0" y="0" width="782" height="42" rx="8" fill="#ffffff" stroke="#86efac"/>
      <rect x="8" y="7" width="160" height="28" rx="6" fill="#dcfce7"/>
      <text x="88" y="25" text-anchor="middle" class="badge" fill="#166534">└── Schema Validation</text>
      <text x="185" y="26" class="pill-text" font-weight="600">Mongoose ODM Data Models  •  Input Sanitization  •  Unique Indexes &amp; DB Populations</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR 2 ==================== -->
  <g transform="translate(460, 545)">
    <line x1="0" y1="0" x2="0" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="-195" y="7" width="390" height="26" rx="13" fill="#ffffff" stroke="#475569" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="0" y="24" text-anchor="middle" class="pill-text">🍃 Mongoose ODM Database Queries (Encrypted TLS Connection)</text>
  </g>

  <!-- ==================== TIER 3: DATABASE ==================== -->
  <g transform="translate(45, 590)">
    <!-- Main Tier Box -->
    <rect x="0" y="0" width="830" height="195" rx="14" fill="url(#dbGrad)" stroke="#9333ea" stroke-width="2" filter="url(#cardShadow)"/>
    
    <!-- Tier Header -->
    <text x="24" y="32" class="tier-heading" fill="#7e22ce">🗄️ [ MongoDB Atlas Cloud Database Tier ]</text>
    <rect x="675" y="16" width="132" height="22" rx="6" fill="#e9d5ff"/>
    <text x="741" y="31" text-anchor="middle" class="badge" fill="#581c87">CLOUD PERSISTENCE</text>

    <!-- Collections Grid (3 columns x 2 rows) -->
    <!-- Col 1, Row 1 -->
    <g transform="translate(24, 48)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">👤 Users Collection</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">Credentials, Roles &amp; Profiles</text>
    </g>

    <!-- Col 2, Row 1 -->
    <g transform="translate(290, 48)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">📅 Events Collection</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">Details, Venue, Capacities</text>
    </g>

    <!-- Col 3, Row 1 -->
    <g transform="translate(558, 48)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">📝 Registrations Collection</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">Volunteers, Status, Waitlists</text>
    </g>

    <!-- Col 1, Row 2 -->
    <g transform="translate(24, 118)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">🎯 Attendances Collection</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">QR Check-ins &amp; Impact Points</text>
    </g>

    <!-- Col 2, Row 2 -->
    <g transform="translate(290, 118)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">💬 Messages Collection</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">Event Group &amp; Admin Chat</text>
    </g>

    <!-- Col 3, Row 2 -->
    <g transform="translate(558, 118)">
      <rect x="0" y="0" width="248" height="58" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
      <text x="16" y="26" class="item-title" fill="#3b0764">🚨 EmergencyRequests</text>
      <text x="16" y="44" class="item-desc" fill="#6b21a8">Relief Needs, Blood &amp; Approvals</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(45, 810)">
    <line x1="0" y1="0" x2="830" y2="0" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="0" y="20" class="meta-text">Project: <tspan font-weight="700" fill="#0f172a">KindConnect</tspan> • Metropolitan University</text>
    <text x="415" y="20" text-anchor="middle" class="meta-text">Team: <tspan font-weight="700" fill="#0f172a">Halima Yesmin Omi</tspan> &amp; <tspan font-weight="700" fill="#0f172a">Shraboni Das</tspan></text>
    <text x="830" y="20" text-anchor="end" class="meta-text">Instructor: <tspan font-weight="700" fill="#0f172a">Mr. Abu Jafar Md. Jakaria</tspan></text>
  </g>
</svg>
